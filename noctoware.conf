# Noctoware Linux — central build configuration.
# Every script sources this file; override any value via environment
# variables or a git-ignored noctoware.local.conf.

NOCTO_NAME="Noctoware"
NOCTO_PRETTY_NAME="Noctoware Linux"
NOCTO_ID="noctoware"
NOCTO_VERSION="0.1"
NOCTO_VERSION_CODENAME="alpha"
NOCTO_VERSION_LABEL="0.1 Alpha"

# [noctoware] pacman repository.  $arch is expanded by pacman, not the shell.
# Initial hosting: GitHub Releases (one rolling release tag holds the db + packages).
# Migration path: point this at any static HTTPS host / object storage bucket.
NOCTO_GH_OWNER="${NOCTO_GH_OWNER:-noctoware}"
NOCTO_GH_REPO="${NOCTO_GH_REPO:-noctoware}"
NOCTO_REPO_TAG="${NOCTO_REPO_TAG:-repo-x86_64}"
NOCTO_REPO_URL="${NOCTO_REPO_URL:-https://github.com/${NOCTO_GH_OWNER}/${NOCTO_GH_REPO}/releases/download/${NOCTO_REPO_TAG}}"

# Package signing key (fingerprint).  Empty → scripts use the local dev key
# generated by scripts/gen-dev-key.sh (NEVER use the dev key for public releases).
NOCTO_SIGNING_KEY="${NOCTO_SIGNING_KEY:-}"

# Include optional components whose redistribution rights are unconfirmed
# (Revo Shell) in the ISO.  Must stay 0 for public builds.
NOCTO_INCLUDE_UNREDISTRIBUTABLE="${NOCTO_INCLUDE_UNREDISTRIBUTABLE:-0}"
