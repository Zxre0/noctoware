LABEL noctoware
TEXT HELP
Boot the Noctoware Linux live system (BIOS).
Try Noctoware and install it from the live desktop.
ENDTEXT
MENU LABEL Noctoware Linux 0.1 Alpha — live (BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% quiet splash

LABEL noctoware-lts
TEXT HELP
Boot the live system with the CachyOS LTS kernel.
ENDTEXT
MENU LABEL Noctoware Linux — live, LTS kernel (BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

LABEL noctoware-safe
TEXT HELP
Boot without kernel modesetting (for problematic GPUs).
ENDTEXT
MENU LABEL Noctoware Linux — live, safe graphics (BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% nomodeset
