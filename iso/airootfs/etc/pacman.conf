#
# /etc/pacman.conf — Noctoware Linux
#
# `sudo pacman -Syu` updates Noctoware, CachyOS and Arch packages together.
# Repository order matters:
#   [noctoware]  Noctoware's own packages (signed by noctoware-keyring)
#   [cachyos]    CachyOS kernel + matching NVIDIA modules (generic x86-64)
#   core/extra/multilib  Arch Linux
#
[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
ILoveCandy
VerbosePkgLists
ParallelDownloads = 5
CheckSpace
# Package signatures are always verified.  Do not change in production.
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[noctoware]
SigLevel = Required DatabaseRequired
Include = /etc/pacman.d/noctoware-mirrorlist

[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
