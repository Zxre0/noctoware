# HyDE starts the bar from Hyprland's start hook concurrently with
# `uwsm finalize`; on a slow first login waybar can start before
# WAYLAND_DISPLAY reaches the systemd user environment and exit with
# "cannot open display".  Restarting picks up the finalized environment.
[Unit]
StartLimitIntervalSec=60
StartLimitBurst=10

[Service]
Restart=on-failure
RestartSec=2
