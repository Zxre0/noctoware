# Noctoware Linux installer (Calamares).  Launched as:
#   calamares -c /usr/share/noctoware/calamares
# Offline install: the live squashfs is copied to disk (unpackfs), then
# live-only bits are removed and hardware-specific drivers are applied.
---
modules-search: [ local, /usr/share/noctoware/calamares/modules-local ]

instances:
- id:       desktop
  module:   packagechooser
  config:   packagechooser_desktop.conf
- id:       live_cleanup
  module:   shellprocess
  config:   shellprocess_live_cleanup.conf
- id:       gpu
  module:   shellprocess
  config:   shellprocess_gpu.conf
- id:       desktop_install
  module:   shellprocess
  config:   shellprocess_desktop.conf
- id:       kernel
  module:   shellprocess
  config:   shellprocess_kernel.conf
- id:       finalize
  module:   shellprocess
  config:   shellprocess_finalize.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - packagechooser@desktop
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - shellprocess@live_cleanup
  - luksbootkeyfile
  - luksopenswaphookcfg
  - initcpiocfg
  - removeuser
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - shellprocess@gpu
  - shellprocess@desktop_install
  - shellprocess@kernel
  - noctoware_bootcfg
  - grubcfg
  - bootloader
  - services-systemd
  - shellprocess@finalize
  - umount
- show:
  - finished

branding: noctoware
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
