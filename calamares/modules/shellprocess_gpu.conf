# Detect the GPU(s) of THIS machine and install only the matching drivers
# into the target (from the ISO's offline cache, falling back to mirrors).
---
dontChroot: true
timeout: 3600
script:
    - command: "/usr/share/noctoware/calamares/scripts/offline-prepare ${ROOT}"
      timeout: 120
    - command: "/usr/bin/noctoware-gpu apply --root ${ROOT} --offline-cache /opt/noctoware/offline/pkg"
      timeout: 3600
