# ESP at /boot holds the kernels for systemd-boot: linux-cachyos and the
# linux-cachyos-lts recovery kernel, each with default + fallback initramfs
# (NVIDIA initramfs images are large) — hence 2 GiB.
---
efiSystemPartition:     "/boot"
efiSystemPartitionSize: 2048M
efiSystemPartitionName: NOCTO_ESP
userSwapChoices:
    - none
    - small
    - suspend
luksGeneration: luks2
drawNestedPartitions:   false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
initialPartitioningChoice: none
initialSwapChoice: none
defaultFileSystemType:  "btrfs"
availableFileSystemTypes:  ["btrfs", "ext4"]
defaultPartitionTableType: gpt
requiredPartitionTableType: [ gpt, msdos ]
