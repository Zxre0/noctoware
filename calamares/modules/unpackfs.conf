# Copy the live root filesystem.  The offline package cache that ships on the
# ISO for optional components (KDE Plasma, NVIDIA) is excluded: packages from
# it are installed on demand by the gpu / desktop_install steps.
---
unpack:
    -   source: "/run/archiso/bootmnt/arch/x86_64/airootfs.sfs"
        sourcefs: "squashfs"
        destination: ""
        exclude: [ "/opt/noctoware/offline" ]
