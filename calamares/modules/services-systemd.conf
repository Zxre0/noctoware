---
units:
  - name: NetworkManager
    action: enable
    mandatory: true
  - name: sddm
    action: enable
    mandatory: true
  - name: bluetooth
    action: enable
    mandatory: false
  - name: systemd-timesyncd
    action: enable
    mandatory: false
  - name: fstrim.timer
    action: enable
    mandatory: false
  - name: snapper-cleanup.timer
    action: enable
    mandatory: false
  - name: pacman-init
    action: disable
    mandatory: false
  - name: graphical.target
    action: set-default
    mandatory: true
