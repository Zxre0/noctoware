# Restore the stock mkinitcpio presets, place the kernels in /boot and build
# the final initramfs images (after GPU drivers are installed).
---
dontChroot: true
timeout: 1800
script:
    - command: "/usr/share/noctoware/calamares/scripts/run-in-target ${ROOT} /usr/share/noctoware/calamares/scripts/kernel-setup"
      timeout: 1800
