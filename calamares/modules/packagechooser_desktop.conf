# Desktop selection. Hyprland + HyDE is always installed; KDE Plasma 6 is an
# optional ADDITIONAL session.  The choice is stored in globalstorage as
# packagechooser_desktop and acted on by shellprocess@desktop_install.
---
mode: required
method: legacy
labels:
    step: "Desktop"
default: hyprland
items:
    - id: hyprland
      name: "Noctoware Hyprland (default)"
      description: "Hyprland with the HyDE desktop and Noctoware theme, SDDM, Steam, Codex CLI and the Claude Code setup assistant. Revo Shell can be added later where its license allows."
      screenshot: "/usr/share/noctoware/calamares/branding/noctoware/desktop-hyprland.png"
    - id: hyprland-plasma
      name: "Noctoware Hyprland + KDE Plasma"
      description: "Everything in the default install, plus KDE Plasma 6 (Wayland) with Dolphin, Konsole, System Settings and the KDE applications. Pick either desktop at the login screen; Hyprland stays the default."
      screenshot: "/usr/share/noctoware/calamares/branding/noctoware/desktop-plasma.png"
