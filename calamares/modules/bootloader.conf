# The stock module only acts on BIOS machines: noctoware_bootcfg sets
# noctoware_bootloader to "grub" on BIOS and "none" on UEFI (where it has
# already installed systemd-boot).
---
efiBootLoaderVar: "noctoware_bootloader"
kernelSearchPath: "/usr/lib/modules"
kernelPattern: "^vmlinuz.*"
kernelParams: [ "quiet" ]
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
efiBootloaderId: "noctoware"
installEFIFallback: true
installHybridGRUB: false
