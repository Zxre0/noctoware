---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - lp
    - video
    - network
    - storage
    - name: wheel
      must_exist: false
      system: true
    - audio
    - rfkill
    - sys
autoLogin: false
doAutologin: false
sudoersGroup: wheel
sudoersConfigureWithGroup: true
setRootPassword: true
doReusePassword: true
passwordRequirements:
    minLength: 6
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: false
user:
  shell: /usr/bin/zsh
  forbidden_names: [ root, liveuser, nobody, daemon, bin, sys, sddm ]
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "noctoware-${cpu}"
  forbidden_names: [ localhost ]
